<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 14px; color: #1f1e1b; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      button { padding: 8px 12px; border-radius: 8px; border: 1px solid #d3e017; background: #e4f222; font-weight: 600; cursor: pointer; width: 100%; }
      button.secondary { background: #fff; border: 1px solid #dcdbd7; color: #6b6a66; font-weight: 500; margin-top: 6px; }
      .dim { color: #6b6a66; font-size: 12px; margin-top: 8px; }
      .ok { color: #1e6b3a; }
      a { color: #1f5eff; }
    </style>
  </head>
  <body>
    <h1 style="display: flex; align-items: center; gap: 8px">
      <img src="icons/icon-32.png" alt="" style="width: 20px; height: 20px; border-radius: 5px" /> One Ramp
    </h1>
    <div id="status" class="dim">Warming up…</div>
    <div style="margin-top: 10px">
      <button id="connect">Connect Gmail</button>
      <button id="disconnect" class="secondary" hidden>Disconnect</button>
    </div>
    <div class="dim" style="margin-top: 10px">
      Once your Gmail is connected, open <a href="https://app.ramp.com/home/personal-expenses/all" target="_blank" rel="noopener noreferrer">your Ramp expenses</a>.
      One Ramp finds the receipt, you click, done ⚡
    </div>
    <script src="popup.js"></script>
  </body>
</html>
